<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}

    <!-- Import local stylesheet  -->
    <link rel="stylesheet" href="{{ '/sahilrajput03.css' | relative_url }}">
  </head>
  <body>
    <div class="container-lg px-3 py-5 markdown-body" style="min-height: 100dvh; display: flex; flex-direction: column;">
      {% if site.title and site.title != page.title %}
      <div><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></div>
      {% endif %}

      {{ content }}

      <!-- Learn: I removed `and site.github.license` from below if condition because I don't have or need any license on my site code yet. -->
      {% if site.github.private != true %}
      <div class="border-top border-gray-light pt-3 text-right text-gray" style="margin-top: auto;">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </div>
      {% endif %}

    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>anchors.add();</script>

    <!-- & Force a reflow to recompute `100dvh` after page load, since Android
      TWA/Chrome sometimes computes dvh before system bars (status/nav/
      gesture bar) settle, causing bottom content to overflow off-screen
      until a resize/reflow is triggered.
      This issue is easily seen if you comment below script code and open the url
      /home as TWA launcher (this is default page currently though).

      See: https://claude.ai/chat/f712cb86-49bb-4ece-af0c-c0bed2c2df72
      -->
    <script>
      function fixDvh() {
        const el = document.querySelector('.container-lg');
        if (!el) return;
        el.style.minHeight = '0';
        el.offsetHeight; // force reflow
        el.style.minHeight = '100dvh';
      }

      // Try immediately, then again after a short delay to catch
      // late system-bar settling in the TWA shell.
      window.addEventListener('load', () => {
        fixDvh();
        setTimeout(fixDvh, 300);
        // setTimeout(fixDvh, 1000);
      });
    </script>
  </body>
</html>
