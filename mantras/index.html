    <!-- ChatGPT: https://chatgpt.com/c/6a2822e0-7a70-83e8-bf8e-4f73dceaa662 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        const params = new URLSearchParams(location.search);
        const firstParamKey = [...params.keys()]?.[0]; // e.g., 'd' when you go to `/?d`
        console.log("🚀 ~ firstParamKey?", firstParamKey);

        const queryParamToMantraDetailsMap = {
            d: { name: 'Detachment', script: 'detachment.js' },
            a: { name: 'Affirmations', script: 'affirm.js' },
            dh: { name: 'Dhyaan Prepping', script: 'dhyaan-prepping.js' },
            w: { name: 'Work', script: 'work.js' },
            s: { name: 'Smoke', script: 'smoke.js' }
        };

        const mantraDetails = queryParamToMantraDetailsMap[firstParamKey];
        if (mantraDetails) {
            loadScript(mantraDetails.script);
        } else {
            // document.body.innerHTML = '<h1 style="color: red; text-align: center; margin-top: 50px;">Sorry, no matching mantra found!</h1>';

            for (const [key, item] of Object.entries(queryParamToMantraDetailsMap)) {
                const button = document.createElement('button');
                button.className = 'mantra-button';
                button.textContent = item.name;
                button.onclick = () => {
                    // console.log("🚀 ~ key?", key)
                    // This loads the html page with the query param, which will then load the corresponding script.
                    location.search = `?${key}`;
                };
                document.querySelector('.mantra-buttons').appendChild(button);
            }
        }

        // Older manual script loading logic
        // if (params.has('d')) { loadScript('detachment.js'); } 

        // Utility fn
        function loadScript(src, { defer = true, async = false, onload, onerror } = {}) {
            if (!src) {
                alert("No script src provided to loadScript function.");
                console.error("No script src provided to loadScript function.");
                return;
            }
            const script = document.createElement('script');
            script.src = src;
            if (defer) script.defer = true;
            if (async) script.async = true;
            if (typeof onload === 'function') script.onload = onload;
            if (typeof onerror === 'function') script.onerror = onerror;
            document.head.appendChild(script);
            return script;
        }

    </script>
