<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Milkdown · Hello world</title>
    <link rel="preconnect" href="https://esm.sh" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@milkdown/crepe@7.23.0/theme/common/style.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/@milkdown/crepe@7.23.0/theme/frame.css"
    />
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202124;
        background: #f5f6f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }

      main {
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #5b65d8;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 5vw, 44px);
        letter-spacing: -.04em;
      }

      .intro {
        margin: 12px 0 28px;
        color: #656b75;
        line-height: 1.6;
      }

      #editor {
        flex: 1;
        min-height: 0;
        padding: 16px 16px 20px;
        border: 1px solid #e4e6eb;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 36px rgb(25 35 55 / 6%);
      }

      #editor .milkdown { min-height: 340px; }
      #editor .ProseMirror { min-height: 340px; outline: none; }

      @media (max-width: 600px) {
        #editor {
          min-height: 0;
          padding: 0 0 20px;
          border-radius: 0;
        }
        #editor .milkdown,
        #editor .ProseMirror { min-height: 100%; }
        #editor .ProseMirror { padding: 0 2px !important; }
        #editor .prosemirror-virtual-cursor { display: none !important; }
        #editor .ProseMirror.virtual-cursor-enabled { caret-color: auto; }
        .hint { margin-top: 10px; }
      }

      .hint {
        margin: 14px 4px 0;
        color: #858b95;
        font-size: 13px;
      }

      .error {
        padding: 16px;
        border: 1px solid #f2c3c3;
        border-radius: 10px;
        color: #8c2929;
        background: #fff4f4;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="editor" aria-label="Markdown editor"></div>
    </main>

    <script type="module">
      const editorRoot = document.querySelector('#editor')

      try {
        const { Crepe } = await import('https://esm.sh/@milkdown/crepe@7.23.0?bundle')
        const crepe = new Crepe({
          root: editorRoot,
          defaultValue: `Lorem ipsum dolor sit amet, consectetur adipiscing elit. Praesent vitae augue sed massa consequat facilisis. Integer feugiat, neque at interdum luctus, justo erat tincidunt nisi, vitae volutpat sapien sem a erat. Curabitur non magna sed lorem vulputate consequat. Sed euismod, velit vel commodo posuere, sapien nibh fermentum mi, at tristique ipsum lacus sed arcu. Donec tempor, lectus non aliquet blandit, enim eros consequat nunc, vitae dignissim mauris erat id justo. Vivamus quis neque eget urna tincidunt finibus. Suspendisse potenti. Nam a lectus vitae augue faucibus tincidunt. Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas. Aenean at lectus nec sem malesuada feugiat. Vestibulum ante ipsum primis in faucibus orci luctus et ultrices posuere cubilia curae; Mauris sed consectetur nulla. Duis vel sem id erat ullamcorper sodales. Aliquam erat volutpat. Etiam at libero velit. Nulla facilisi. Donec sed urna in justo interdum pellentesque. Morbi non ante ac erat placerat fringilla. Phasellus euismod, augue non tempor interdum, neque dolor eleifend magna, a aliquam massa nibh id erat. Quisque sit amet sapien at tortor varius dapibus. Nam vel tellus quis neque tincidunt vehicula. Ut vitae quam ut nulla convallis tincidunt.\n\n###### Heading 6\nThis is simple text.\n\n##### Heading 5\nThis is simple text.\n\n#### Heading 4\nThis is simple text.\n\n### Heading 3\nThis is simple text.\n\n## Heading 2\nThis is simple text.\n\n# Heading 1\nLorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Pellentesque habitant morbi tristique senectus et netus et malesuada fames ac turpis egestas.`,
        })

        await crepe.create()

        // Apply to the rendered node so theme styles cannot reintroduce top spacing.
        const proseMirror = editorRoot.querySelector('.ProseMirror')
        if (proseMirror) {
          proseMirror.style.setProperty('padding-top', '0', 'important')
        }

        if (matchMedia('(max-width: 768px), (pointer: coarse)').matches) {

          let repositionTimer
          const repositionToolbar = () => {
            clearTimeout(repositionTimer)
            repositionTimer = setTimeout(() => requestAnimationFrame(() => {
            const toolbar = editorRoot.querySelector('.milkdown-toolbar[data-show="true"]')
            const selection = window.getSelection()
            if (!toolbar || !selection || selection.isCollapsed || !selection.rangeCount) return

            const selectedRect = selection.getRangeAt(0).getBoundingClientRect()
            const toolbarRect = toolbar.getBoundingClientRect()
            const offsetParent = toolbar.offsetParent || editorRoot
            const parentRect = offsetParent.getBoundingClientRect()
            const isAboveSelection = toolbarRect.bottom <= selectedRect.top
            const top = isAboveSelection
              ? selectedRect.top - parentRect.top + offsetParent.scrollTop - toolbarRect.height - 65
              : selectedRect.bottom - parentRect.top + offsetParent.scrollTop + 100

            toolbar.style.setProperty('top', `${top}px`, 'important')
            }), 120)
          }

          document.addEventListener('selectionchange', repositionToolbar)
          editorRoot.addEventListener('touchend', repositionToolbar)
          const placementObserver = new MutationObserver(repositionToolbar)
          placementObserver.observe(editorRoot, { attributes: true, subtree: true, attributeFilter: ['data-show'] })


        }

      } catch (error) {
        console.error('Could not initialize Milkdown:', error)
        editorRoot.innerHTML = '<p class="error">Milkdown could not load. Check your internet connection and reload this page.</p>'
      }
    </script>
  </body>
</html>
