<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Browser Code Explorer</title>
    <style>
      :root { color-scheme: dark; --bg: #1e1e1e; --panel: #181818; --panel-2: #252526; --border: #3c3c3c; --text: #cccccc; --muted: #858585; --active: #37373d; --blue: #007fd4; --danger: #f48771; --editor-font-size: 14px; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
      button, input { font: inherit; }
      button { color: inherit; border: 0; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid #75beff; outline-offset: -2px; }
      #app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100dvh; }
      .sidebar { min-width: 0; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
      .sidebar-header, .toolbar { min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
      .sidebar-header { justify-content: space-between; }
      .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      .icon-button { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 4px; background: transparent; font-size: 20px; }
      .icon-button:hover, .icon-button:focus-visible { background: var(--active); }
      .primary { min-height: 36px; padding: 0 12px; border-radius: 3px; background: var(--blue); color: white; font-weight: 600; }
      .primary:hover { background: #168ad5; }
      .secondary { min-height: 36px; padding: 0 10px; border: 1px solid #555; border-radius: 3px; background: #333; color: #ddd; font-weight: 600; }.secondary:hover { background: #444; }
      #tree { overflow: auto; padding: 6px 0 16px; flex: 1; }
      .tree-item { width: 100%; min-height: 30px; display: flex; align-items: center; gap: 5px; padding: 3px 8px; background: transparent; text-align: left; white-space: nowrap; overflow: hidden; }
      .tree-item:hover { background: #2a2d2e; }.tree-item.active { background: var(--active); }
      .tree-item .label { overflow: hidden; text-overflow: ellipsis; }.caret { width: 14px; color: var(--muted); }.file-icon { width: 16px; color: #c5c5c5; }
      .empty-tree { padding: 28px 20px; color: var(--muted); text-align: center; }
      .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      .toolbar { justify-content: space-between; background: var(--panel-2); }.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 6px; }
      .folder-name { max-width: 48vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ddd; }
      .shortcut { color: var(--muted); font-size: 12px; }
      .tabs { display: flex; min-height: 36px; overflow-x: auto; background: var(--panel-2); border-bottom: 1px solid var(--border); scrollbar-width: thin; }
      .tab { flex: 0 0 auto; max-width: 220px; min-height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 4px 0 12px; color: #aaa; background: #2d2d2d; border-right: 1px solid var(--border); }
      .tab.active { color: #fff; background: var(--bg); border-top: 1px solid var(--blue); }.tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dirty { color: white; font-size: 15px; }.tab-close { width: 32px; height: 32px; background: transparent; border-radius: 3px; color: #aaa; font-size: 18px; }.tab-close:hover { background: #444; color: white; }
      .editor-wrap { min-height: 0; flex: 1; position: relative; overflow: hidden; }.cm-editor { height: 100%; max-height: 100%; }.cm-scroller { height: 100%; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: var(--editor-font-size); }
      .mobile-font-control { display: none; font-size: 15px; font-weight: 700; }
      .save-label { display: none; }
      .welcome { height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }.welcome h1 { margin: 0 0 8px; font-size: 24px; color: #ddd; }.welcome p { max-width: 400px; margin: 0 0 18px; }
      .modal-backdrop { position: fixed; inset: 0; z-index: 10; display: grid; place-items: start center; padding: max(8vh, env(safe-area-inset-top)) 16px 16px; background: #0008; }.modal { width: min(680px, 100%); overflow: hidden; border: 1px solid #555; border-radius: 6px; background: #252526; box-shadow: 0 20px 60px #0009; }.search-input { width: 100%; height: 52px; padding: 0 16px; border: 0; border-bottom: 1px solid var(--border); background: #3c3c3c; color: white; }.results { max-height: min(55dvh, 440px); overflow: auto; }.result { width: 100%; min-height: 54px; padding: 8px 14px; background: transparent; text-align: left; }.result.selected, .result:hover { background: #094771; }.result-name, .result-path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.result-path { color: #b6b6b6; font-size: 12px; }.empty-results { padding: 22px; color: var(--muted); text-align: center; }
      .notice { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 20; transform: translateX(-50%); max-width: min(92vw, 560px); padding: 10px 14px; border-radius: 4px; background: #333; box-shadow: 0 4px 18px #0008; }.notice.error { background: #6e2921; }
      [hidden] { display: none !important; }
      @media (max-width: 767px) { #app { display: block; }.main { height: 100dvh; }.editor-wrap, .cm-scroller { touch-action: pan-x pan-y pinch-zoom; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }.sidebar { position: fixed; z-index: 5; inset: 0 auto 0 0; width: min(86vw, 330px); transform: translateX(-102%); transition: transform .18s ease; box-shadow: 5px 0 20px #0008; }.sidebar.open { transform: translateX(0); }.toolbar, .sidebar-header { min-height: 30px; padding: 1px 4px; gap: 2px; }.shortcut, .folder-name, .save-symbol { display: none; }.primary, .secondary { min-height: 26px; padding: 0 7px; font-size: 11px; }.mobile-font-control { display: grid; place-items: center; }.save-label { display: inline; font-size: 11px; font-weight: 700; }.icon-button, .tab-close { width: 28px; min-width: 28px; height: 28px; min-height: 28px; font-size: 14px; }.tabs { min-height: 28px; }.tab { min-height: 28px; max-width: 150px; padding-left: 6px; gap: 2px; font-size: 11px; }.tab-close { font-size: 14px; }.tree-item { min-height: 23px; padding-top: 0; padding-bottom: 0; font-size: 12px; }.modal-backdrop { padding: max(4vh, env(safe-area-inset-top)) 10px 10px; }.modal { max-height: 92dvh; }.search-input { height: 40px; } }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" id="sidebar" aria-label="File explorer">
        <div class="sidebar-header"><span class="title" id="explorer-title">Explorer</span><button class="icon-button" id="close-sidebar" aria-label="Close explorer">×</button></div>
        <div id="tree"><div class="empty-tree">Open a folder to start exploring your local files.</div></div>
      </aside>
      <main class="main">
        <header class="toolbar">
          <div class="toolbar-left"><button class="icon-button" id="toggle-sidebar" aria-label="Open explorer">☰</button><button class="primary" id="open-folder">Open Folder</button><button class="secondary" id="reconnect-folder" hidden>Reconnect</button><span class="folder-name" id="folder-name">No folder selected</span></div>
          <div class="toolbar-right"><button class="icon-button mobile-font-control" id="decrease-font" aria-label="Decrease editor font size" title="Decrease font size">A−</button><button class="icon-button mobile-font-control" id="increase-font" aria-label="Increase editor font size" title="Increase font size">A+</button><button class="icon-button" id="search-button" aria-label="Quick open files" title="Quick Open (Ctrl/Cmd + P)">⌕</button><button class="icon-button" id="save-button" aria-label="Save active file" title="Save (Ctrl/Cmd + S)"><span class="save-symbol">⌘</span><span class="save-label">Save</span></button><span class="shortcut">Ctrl/Cmd+P · Ctrl/Cmd+S</span></div>
        </header>
        <div class="tabs" id="tabs" aria-label="Open files"></div>
        <section class="editor-wrap" id="editor-wrap"><div class="welcome" id="welcome"><div><h1>Browser Code Explorer</h1><p>Select a local folder to search, open, edit, and save files directly from your browser.</p><button class="primary" id="welcome-open">Open Folder</button></div></div></section>
      </main>
    </div>
    <input id="fallback-folder" type="file" webkitdirectory multiple hidden />
    <div class="modal-backdrop" id="search-modal" hidden><div class="modal" role="dialog" aria-modal="true" aria-label="Quick open file"><input class="search-input" id="search-input" placeholder="Search files by name or path…" autocomplete="off" /><div class="results" id="results"></div></div></div>
    <div class="notice" id="notice" hidden role="status"></div>

    <script type="module">
      // Keep this version aligned with the State dependency resolved by the other
      // CodeMirror packages. Mixing State versions corrupts editor selections.
      import { EditorState } from 'https://esm.sh/@codemirror/state@6.7.6';
      import { EditorView, keymap, lineNumbers, highlightActiveLine, drawSelection } from 'https://esm.sh/@codemirror/view@6.43.14';
      import { defaultKeymap, history, historyKeymap, indentWithTab } from 'https://esm.sh/@codemirror/commands@6.11.1';
      import { bracketMatching } from 'https://esm.sh/@codemirror/language@6.13.1';
      import { autocompletion, closeBrackets, closeBracketsKeymap, completionKeymap } from 'https://esm.sh/@codemirror/autocomplete@6.20.3';
      import { highlightSelectionMatches, searchKeymap } from 'https://esm.sh/@codemirror/search@6.7.2';
      import { javascript } from 'https://esm.sh/@codemirror/lang-javascript@6.2.3';
      import { json } from 'https://esm.sh/@codemirror/lang-json@6.0.1';
      import { html } from 'https://esm.sh/@codemirror/lang-html@6.4.9';
      import { css } from 'https://esm.sh/@codemirror/lang-css@6.3.1';
      import { markdown } from 'https://esm.sh/@codemirror/lang-markdown@6.3.2';
      import { vscodeDark } from 'https://esm.sh/@uiw/codemirror-theme-vscode@4.25.12';
      import Fuse from 'https://esm.sh/fuse.js@7.0.0';

      const $ = (selector) => document.querySelector(selector);
      const state = { files: [], rootName: '', openTabs: [], activeId: null, editor: null, fuse: null, selectedResult: 0, fallback: false, directoryHandle: null };
      const ignoredDirectories = new Set(['node_modules', '.git', 'dist', 'build', '.next', 'coverage']);
      const databaseName = 'browser-code-explorer';
      const handleStoreName = 'settings';
      const fontSizeStorageKey = 'browser-code-explorer-font-size';
      const minimumFontSize = 11;
      const maximumFontSize = 28;
      let noticeTimer;


      function showNotice(message, error = false) { const el = $('#notice'); el.textContent = message; el.className = `notice${error ? ' error' : ''}`; el.hidden = false; clearTimeout(noticeTimer); noticeTimer = setTimeout(() => el.hidden = true, 3800); }
      function savedFontSize() { const value = Number.parseInt(localStorage.getItem(fontSizeStorageKey), 10); return Number.isFinite(value) ? Math.min(maximumFontSize, Math.max(minimumFontSize, value)) : 14; }
      function setEditorFontSize(size) { const nextSize = Math.min(maximumFontSize, Math.max(minimumFontSize, size)); document.documentElement.style.setProperty('--editor-font-size', `${nextSize}px`); localStorage.setItem(fontSizeStorageKey, String(nextSize)); state.editor?.requestMeasure(); showNotice(`Editor font: ${nextSize}px`); }
      function extension(path) { const name = path.split('/').pop(); const dot = name.lastIndexOf('.'); return dot > 0 ? name.slice(dot + 1).toLowerCase() : ''; }
      function languageFor(file) { const ext = file.extension; if (['ts', 'tsx'].includes(ext)) return javascript({ typescript: true, jsx: ext === 'tsx' }); if (['js', 'jsx', 'mjs', 'cjs'].includes(ext)) return javascript({ jsx: ['jsx'].includes(ext) }); if (ext === 'json') return json(); if (['html', 'htm', 'svg'].includes(ext)) return html(); if (['css', 'scss', 'less'].includes(ext)) return css(); if (['md', 'mdx'].includes(ext)) return markdown(); return []; }
      function activeTab() { return state.openTabs.find(tab => tab.file.id === state.activeId); }
      function updateExplorerTitle() { $('#explorer-title').textContent = state.rootName ? `Explorer · ${state.rootName}` : 'Explorer'; $('#folder-name').textContent = state.rootName || 'No folder selected'; }
      function openHandleDatabase() { return new Promise((resolve, reject) => { const request = indexedDB.open(databaseName, 1); request.onupgradeneeded = () => request.result.createObjectStore(handleStoreName); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); }
      async function saveLastFolder(handle) { const database = await openHandleDatabase(); await new Promise((resolve, reject) => { const request = database.transaction(handleStoreName, 'readwrite').objectStore(handleStoreName).put(handle, 'last-folder'); request.onsuccess = resolve; request.onerror = () => reject(request.error); }); database.close(); }
      async function loadLastFolder() { const database = await openHandleDatabase(); const handle = await new Promise((resolve, reject) => { const request = database.transaction(handleStoreName).objectStore(handleStoreName).get('last-folder'); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); }); database.close(); return handle; }

      async function collectDirectory(handle, prefix = '') {
        const found = [];
        for await (const [name, child] of handle.entries()) {
          if (child.kind === 'directory') { if (!ignoredDirectories.has(name)) found.push(...await collectDirectory(child, `${prefix}${name}/`)); }
          else found.push({ id: `${prefix}${name}`, name, relativePath: `${prefix}${name}`, extension: extension(name), handle: child });
        }
        return found;
      }
      function setFiles(files, name, fallback = false) { state.files = files.sort((a, b) => a.relativePath.localeCompare(b.relativePath)); state.rootName = name; state.fallback = fallback; state.fuse = new Fuse(state.files, { keys: [{ name: 'name', weight: .65 }, { name: 'relativePath', weight: .35 }], threshold: .36, ignoreLocation: true }); updateExplorerTitle(); renderTree(); showNotice(fallback ? 'Read-only folder opened. Saving is unavailable in this browser.' : `${state.files.length} files indexed.`); }
      async function chooseFolder() { try { if (!window.showDirectoryPicker) { $('#fallback-folder').click(); return; } const handle = await window.showDirectoryPicker({ mode: 'readwrite' }); state.directoryHandle = handle; await saveLastFolder(handle); setFiles(await collectDirectory(handle), handle.name); $('#reconnect-folder').hidden = true; } catch (error) { if (error.name !== 'AbortError') showNotice(`Could not open folder: ${error.message}`, true); } }
      async function restoreLastFolder(interactive = false) { try { if (!window.showDirectoryPicker) return; const handle = state.directoryHandle || await loadLastFolder(); if (!handle) return; state.directoryHandle = handle; let permission = await handle.queryPermission({ mode: 'readwrite' }); if (permission !== 'granted' && interactive) permission = await handle.requestPermission({ mode: 'readwrite' }); if (permission !== 'granted') { $('#reconnect-folder').hidden = false; showNotice('Last folder found. Click Reconnect to grant access again.'); return; } setFiles(await collectDirectory(handle), handle.name); $('#reconnect-folder').hidden = true; showNotice(`Restored ${handle.name}.`); } catch (error) { $('#reconnect-folder').hidden = false; showNotice(`Could not restore the last folder: ${error.message}`, true); } }
      function renderTree() {
        const tree = $('#tree'); if (!state.files.length) { tree.innerHTML = '<div class="empty-tree">No files found in this folder.</div>'; return; }
        const root = {};
        for (const file of state.files) { let node = root; for (const segment of file.relativePath.split('/')) node = node[segment] ||= {}; node.__file = file; }
        tree.replaceChildren(buildTree(root, 0));
      }
      function buildTree(node, level) { const fragment = document.createDocumentFragment(); const entries = Object.entries(node).filter(([name]) => name !== '__file').sort(([a, av], [b, bv]) => Number(!av.__file) - Number(!bv.__file) || a.localeCompare(b)); for (const [name, value] of entries) { const file = value.__file; const row = document.createElement('button'); row.className = `tree-item${file?.id === state.activeId ? ' active' : ''}`; row.style.paddingLeft = `${8 + level * 14}px`; if (file) { row.innerHTML = `<span class="file-icon">◻</span><span class="label"></span>`; row.querySelector('.label').textContent = name; row.onclick = () => openFile(file); } else { const children = buildTree(value, level + 1); const holder = document.createElement('div'); holder.hidden = true; row.innerHTML = `<span class="caret">›</span><span class="file-icon">▸</span><span class="label"></span>`; row.querySelector('.label').textContent = name; row.onclick = () => { holder.hidden = !holder.hidden; row.querySelector('.caret').textContent = holder.hidden ? '›' : '⌄'; }; fragment.append(row, holder); continue; } fragment.append(row); } return fragment; }
      async function readFile(file) { return file.handle ? await (await file.handle.getFile()).text() : await file.fallbackFile.text(); }
      async function openFile(file) { snapshotActiveTab(); let tab = state.openTabs.find(item => item.file.id === file.id); if (!tab) { try { const content = await readFile(file); tab = { file, content, savedContent: content, dirty: false, selection: { anchor: 0, head: 0 }, scrollTop: 0 }; state.openTabs.push(tab); } catch (error) { showNotice(`Could not read ${file.name}: ${error.message}`, true); return; } } state.activeId = file.id; renderTabs(); renderTree(); mountEditor(); $('#sidebar').classList.remove('open'); }
      function snapshotActiveTab() { const tab = activeTab(); if (!tab || !state.editor) return; tab.content = state.editor.state.doc.toString(); tab.selection = state.editor.state.selection.main; tab.scrollTop = state.editor.scrollDOM.scrollTop; tab.dirty = tab.content !== tab.savedContent; }
      function editorExtensions(file) { return [lineNumbers(), history(), drawSelection(), highlightActiveLine(), bracketMatching(), closeBrackets(), autocompletion(), highlightSelectionMatches(), keymap.of([...defaultKeymap, ...historyKeymap, ...completionKeymap, ...closeBracketsKeymap, ...searchKeymap, indentWithTab]), vscodeDark, languageFor(file), EditorView.updateListener.of(update => { if (update.docChanged) { const tab = activeTab(); if (tab) { tab.content = update.state.doc.toString(); tab.dirty = tab.content !== tab.savedContent; renderTabs(); } } })]; }
      function mountEditor() { state.editor?.destroy(); state.editor = null; const tab = activeTab(); $('#welcome').hidden = Boolean(tab); if (!tab) return; const view = new EditorView({ state: EditorState.create({ doc: tab.content, selection: tab.selection, extensions: editorExtensions(tab.file) }), parent: $('#editor-wrap') }); state.editor = view; requestAnimationFrame(() => { view.scrollDOM.scrollTop = tab.scrollTop || 0; view.focus(); }); }
      function renderTabs() { const host = $('#tabs'); host.replaceChildren(); for (const tab of state.openTabs) { const item = document.createElement('div'); item.className = `tab${tab.file.id === state.activeId ? ' active' : ''}`; item.title = tab.file.relativePath; const name = document.createElement('button'); name.className = 'tab-name'; name.textContent = tab.file.name; name.onclick = () => switchTab(tab.file.id); const marker = document.createElement('span'); marker.className = 'dirty'; marker.textContent = tab.dirty ? '•' : ''; const close = document.createElement('button'); close.className = 'tab-close'; close.setAttribute('aria-label', `Close ${tab.file.name}`); close.textContent = '×'; close.onclick = event => { event.stopPropagation(); closeTab(tab.file.id); }; item.append(name, marker, close); host.append(item); if (tab.file.id === state.activeId) requestAnimationFrame(() => item.scrollIntoView({ block: 'nearest', inline: 'nearest' })); } }
      function switchTab(id) { if (id === state.activeId) return; snapshotActiveTab(); state.activeId = id; renderTabs(); renderTree(); mountEditor(); }
      function closeTab(id) { snapshotActiveTab(); const tab = state.openTabs.find(item => item.file.id === id); if (tab?.dirty && !confirm(`Discard unsaved changes in ${tab.file.name}?`)) return; const index = state.openTabs.findIndex(item => item.file.id === id); state.openTabs.splice(index, 1); if (state.activeId === id) state.activeId = state.openTabs[Math.max(0, index - 1)]?.file.id ?? null; renderTabs(); renderTree(); mountEditor(); }
      async function saveActive() { snapshotActiveTab(); const tab = activeTab(); if (!tab) return; if (state.fallback || !tab.file.handle) { showNotice('This browser opened the folder in read-only fallback mode.', true); return; } try { const writable = await tab.file.handle.createWritable(); await writable.write(tab.content); await writable.close(); tab.savedContent = tab.content; tab.dirty = false; renderTabs(); showNotice(`Saved ${tab.file.relativePath}`); } catch (error) { showNotice(`Save failed: ${error.message}`, true); } }
      function searchResults(query = '') { return query ? state.fuse.search(query, { limit: 100 }).map(item => item.item) : state.files.slice(0, 100); }
      function renderResults() { const query = $('#search-input').value.trim(); const files = searchResults(query); state.currentResults = files; state.selectedResult = Math.min(state.selectedResult, Math.max(files.length - 1, 0)); const host = $('#results'); host.replaceChildren(); if (!files.length) { host.innerHTML = '<div class="empty-results">No matching files</div>'; return; } files.forEach((file, index) => { const button = document.createElement('button'); button.className = `result${index === state.selectedResult ? ' selected' : ''}`; button.innerHTML = '<span class="result-name"></span><span class="result-path"></span>'; button.querySelector('.result-name').textContent = file.name; button.querySelector('.result-path').textContent = file.relativePath; button.onmouseenter = () => { state.selectedResult = index; [...host.children].forEach((item, itemIndex) => item.classList.toggle('selected', itemIndex === index)); }; button.onpointerdown = event => { event.preventDefault(); closeSearch(); void openFile(file); }; host.append(button); }); }
      function openSearch() { if (!state.files.length) { showNotice('Open a folder first.', true); return; } state.selectedResult = 0; $('#search-modal').hidden = false; $('#search-input').value = ''; renderResults(); requestAnimationFrame(() => $('#search-input').focus()); }
      function closeSearch() { $('#search-modal').hidden = true; }

      $('#open-folder').onclick = chooseFolder; $('#welcome-open').onclick = chooseFolder; $('#reconnect-folder').onclick = () => restoreLastFolder(true); $('#decrease-font').onclick = () => setEditorFontSize(savedFontSize() - 1); $('#increase-font').onclick = () => setEditorFontSize(savedFontSize() + 1); $('#search-button').onclick = openSearch; $('#save-button').onclick = saveActive; $('#toggle-sidebar').onclick = () => $('#sidebar').classList.toggle('open'); $('#close-sidebar').onclick = () => $('#sidebar').classList.remove('open');
      $('#fallback-folder').onchange = event => { const files = [...event.target.files].map(file => ({ id: file.webkitRelativePath || file.name, name: file.name, relativePath: file.webkitRelativePath || file.name, extension: extension(file.name), fallbackFile: file })); setFiles(files, files[0]?.relativePath.split('/')[0] || 'Selected folder', true); event.target.value = ''; };
      $('#search-input').oninput = () => { state.selectedResult = 0; renderResults(); };
      $('#search-input').onkeydown = event => { const results = state.currentResults || []; if (event.key === 'ArrowDown') { event.preventDefault(); state.selectedResult = Math.min(state.selectedResult + 1, results.length - 1); renderResults(); } else if (event.key === 'ArrowUp') { event.preventDefault(); state.selectedResult = Math.max(state.selectedResult - 1, 0); renderResults(); } else if (event.key === 'Enter' && results[state.selectedResult]) { closeSearch(); openFile(results[state.selectedResult]); } else if (event.key === 'Escape') closeSearch(); };
      $('#search-modal').onclick = event => { if (event.target === $('#search-modal')) closeSearch(); };
      window.addEventListener('keydown', event => { if ((event.metaKey || event.ctrlKey) && event.code === 'KeyP') { event.preventDefault(); event.stopPropagation(); openSearch(); } if ((event.metaKey || event.ctrlKey) && event.code === 'KeyS') { event.preventDefault(); event.stopPropagation(); saveActive(); } if (event.key === 'Escape') { closeSearch(); $('#sidebar').classList.remove('open'); } }, { capture: true });
      window.addEventListener('beforeunload', event => { snapshotActiveTab(); if (state.openTabs.some(tab => tab.dirty)) { event.preventDefault(); event.returnValue = ''; } });
      document.documentElement.style.setProperty('--editor-font-size', `${savedFontSize()}px`);
      updateExplorerTitle();
      void restoreLastFolder();
    </script>
  </body>
</html>
